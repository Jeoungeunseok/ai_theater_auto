    status: pending
    hooks:
      - "매번 내가 짜는 거 사실 지쳤거든"
    tips:
      - '"어디든 좋아" 말고 2개 옵션 제시 후 선택 유도'
      - 지난번 데이트 칭찬하며 "네가 잘 알잖아" 공략
