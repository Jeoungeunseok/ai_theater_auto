# 팡이 아키타입 뱅크 — 본심 상황 유형 × 능청 해법 조합
# status: pending | used
# 새 아키타입 추가 시 status: pending으로 설정

직장:
  - id: W01
    situation: 상사 몰래 쉬고 싶다
    topic: 상사 몰래 쉬는 법
    status: pending
    hooks:
      - "솔직히 말해봐. 지금 일하는 척하고 있지?"
      - "상사 눈 피해서 쉬는 게 진짜 실력이야"
    tips:
      - 모니터 각도 15도 조정
      - 키보드 소리 유지 (빈 문서에 두드리기)
      - 메모장에 업무 키워드 띄워놓기

  - id: W02
