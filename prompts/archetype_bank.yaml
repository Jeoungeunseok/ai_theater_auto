    topic: 칼퇴 명분 만들기
    status: pending
    hooks:
      - "퇴근 시간 됐는데 눈치 보이는 당신에게"
      - "칼퇴는 권리야, 근데 명분이 있으면 더 편하지"
    tips:
      - 퇴근 30분 전 상사에게 선제 질문
      - 가방은 업무 중에 미리 정리
      - '"내일 아침 일찍 처리하면 안 될까요?"로 탈출'

  - id: W03
    situation: 회의가 너무 길고 지루하다
    topic: 지루한 회의 버티는 법
    status: pending
    hooks:
      - "회의 2시간째, 아직도 결론이 없다면?"
    tips:
      - 노트북에 회의록 작성하는 척
      - 고개를 천천히 끄덕이며 딴생각
      - 중간에 질문 하나로 존재감 어필

  - id: W04
    situation: 야근 요청을 거절하고 싶다
    topic: 야근 우아하게 거절하는 법
    status: pending
    hooks:
      - "오늘도 야근 요청? 이제 팡이한테 배워봐"
    tips:
      - "내일 오전 첫 번째로 처리하겠습니다"
      - 퇴근 전 진행 상황 공유로 선점
      - 개인 일정을 미리 캘린더에 등록

  - id: W05
    situation: 점심시간을 최대한 길게 쓰고 싶다
    topic: 점심시간 늘리는 꿀팁
    status: pending
    hooks:
      - "점심 1시간은 너무 짧아. 진짜로."
    tips:
      - 11시 50분에 일어서기 (먼저 나가면 눈치 없음)
      - 멀리 있는 맛집 선택은 계획적으로
      - 돌아올 때 동료 간식 사오기 (명분 완성)

욕망:
  - id: D01
