    topic: 용돈 협상 기술
    status: pending
    hooks:
      - "물가가 올랐는데 용돈은 그대로, 이 억울함 팡이가 이해해"
      - "같이 사는데 돈 얘기가 제일 어렵지, 맞지?"
    tips:
      - 물가 인상 데이터를 자연스럽게 대화에 흘리기
      - '"나만 줄이는 게 아니라 같이 아끼자" 공동 절약 프레임'
      - 협상 전 상대방 기분 좋을 때를 노리기

