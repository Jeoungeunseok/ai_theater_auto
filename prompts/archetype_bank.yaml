    tips:
      - 지금 끊으면 찜찜하니 이 판만 완결
      - '"이기면 끊어야지"로 명분 확보'
      - 승리로 끝내야 숙면할 수 있다

부부:
  - id: C01
    situation: 집안일을 모른 척하고 싶다
    topic: 집안일 자연스럽게 피하는 법
    status: pending
    hooks:
      - "안 보이면 내 일이 아닌 거야, 맞지?"
    tips:
      - 집에 들어오자마자 욕실로 직행
      - 다른 집안일 하나 열심히 해서 상쇄
      - '"내가 이건 할게" 선점으로 나머지 방어'

  - id: C02
    situation: 사고 싶은 게 있는데 눈치가 보인다
    topic: 파트너 몰래 사는 기술
    status: pending
    hooks:
      - "사고 싶은 거 있는데 말 못 하고 있지?"
    tips:
      - 필요성을 미리 3번 언급해두기
      - 세일 기간을 이유로 긴급성 부여
      - 구매 후 "원래 있던 거야" 전략

  - id: C03
