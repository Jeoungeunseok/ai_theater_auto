      - "오늘 먹고 내일부터, 이 마음 팡이가 이해해"
    tips:
      - 오늘은 '마지막 만찬' 프레임
      - 월요일부터 시작이 훨씬 깔끔하다
      - 먹으면서 운동 유튜브 보기 (준비 단계)

