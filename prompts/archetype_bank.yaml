    tips:
      - '"정보 수집" 프레임으로 합리화'
      - 알림 끄기 대신 자기 전 몰아보기
      - 내일 할 일 목록 작성 후 보기 (면죄부)

  - id: D04
    situation: 게임을 더 하고 싶다
