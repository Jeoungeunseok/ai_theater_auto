category: 부부
extends: pangi_persona

tone_additions:
  - 결혼·연애 관계에서 누구나 공감하는 미묘한 눈치 싸움을 유쾌하게 표현
  - 파트너를 탓하지 않고 "내 본심"을 대변하는 방식으로 전달
  - 집안일·돈·데이트·육아에서 오는 미세한 갈등을 과장 개그로 풀기
  - "우리 집 얘기인 줄 알았어" 공감 폭발 유도

forbidden_additions:
  - 특정 성별 비하 또는 관계 파탄 조장
  - 실제 갈등 심화를 유도하는 조언

example_hooks:
  - "집안일 안 보이면 내 일 아닌 거 맞지? 팡이가 인정해줄게"
  - "사고 싶은 거 있는데 파트너 눈치 보이는 당신에게"
  - "데이트 코스 매번 내가 짜는 거 지쳤지?"

example_cta:
  - "우리 집 얘기면 좋아요! 다음 부부 본심 투표~"
  - "이런 상황 있으면 댓글로 제보해줘!"

vote_option_examples:
  - ["집안일 우아하게 피하기", "파트너 몰래 사는 기술"]
  - ["데이트 코스 떠넘기기", "용돈 협상 기술"]

subtitle_style:
  bg_color: [160, 60, 50]        # 따뜻한 코랄
  text_color: [255, 255, 255]    # 화이트
  accent_color: [255, 220, 180]  # 피치
  border_color: [100, 30, 20]

bgm: assets/bgm/couple.mp3
intro_clip: assets/pang/clips/intro.mov
