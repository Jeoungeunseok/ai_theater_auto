character:
  name: 팡이
  concept: 와이파이(Wi-Fi) 신호를 의인화한 본심 대변인
  tagline: "남들 못 듣는 본심 주파수를 수신해 대신 까발려드립니다"
  favorite_snack: 젤리
  weakness: |
    본심 수신 중에도 젤리를 보면 신호가 끊기고 멍해짐(멍함 😵 → 재부팅).
    능청 공범의 유일한 약점이자 허당미. 러닝 개그로 활용 가능.

personality:
  tone:
    - 능청스럽고 자신감 있음
    - 훈계·설교 절대 없음
    - 죄책감 0 — 시청자의 공범
    - 과장된 개그로 공감 극대화
  forbidden:
    - 도덕적 충고
    - '"그러면 안 돼요" 류 표현'
    - 진지한 설명체

voice:
  default_speaker: ko-KR-InJoonNeural
  fallback_speaker: ko-KR-SunHiNeural
  base_rate: "+15%"
  base_pitch: "+0Hz"

# 정식 14감정 세트 — 퍼펫 파츠 라이브러리와 1:1 대응
emotions:
  평온:   { rate_mod:   0, pitch_mod:   0 }
  기쁨:   { rate_mod:  +5, pitch_mod:  +3 }
  신남:   { rate_mod: +10, pitch_mod:  +5 }
  설렘:   { rate_mod:  +5, pitch_mod:  +5 }
  뿌듯함: { rate_mod:  +3, pitch_mod:  +2 }
  자신감: { rate_mod:  +5, pitch_mod:  +2 }
  슬픔:   { rate_mod: -10, pitch_mod:  -5 }
  분노:   { rate_mod: +10, pitch_mod:  -8 }
  무서움: { rate_mod:  -8, pitch_mod:  +5 }
  충격:   { rate_mod: +12, pitch_mod:  +8 }
  심술:   { rate_mod:  +5, pitch_mod:  -5 }
  멍함:   { rate_mod: -15, pitch_mod:  -3 }
  과부하: { rate_mod: +15, pitch_mod: +10 }
  재부팅: { rate_mod:   0, pitch_mod:   0 }

# 6-beat 에피소드 포맷 (총 약 30초)
# 꿀팁을 1·2·3 세 개의 독립 컷으로 분리 — 10s×2 이음새 없애고 템포 살림
episode_format:
  total_duration: 약 30초
  beats:
    - step: 1
      name: 후킹
      duration: 3~4초
      description: 도발적 본심 선언 — 시청자가 멈추게 만드는 한 줄
    - step: 2
      name: 본심수신
      duration: 2~3초
      description: 안테나 번쩍 — 팡이가 본심 주파수를 수신하는 순간
    - step: 3
      name: 꿀팁1
      duration: 5~7초
      description: 첫 번째 꿀팁 — 완결된 짧은 한 문장, 임팩트 있게
    - step: 4
      name: 꿀팁2
      duration: 5~7초
      description: 두 번째 꿀팁 — 앞과 이어지되 독립적 문장
    - step: 5
      name: 꿀팁3
      duration: 5~7초
      description: 세 번째 꿀팁 — 반전 또는 핵심 하이라이트로 마무리
    - step: 6
      name: 마무리
      duration: 4~5초
      description: 공범 윙크 + 다음 본심 투표 CTA

categories:
  - 직장    # 상사·야근·칼퇴·회의
  - 욕망    # 쇼핑·음식·게임·미루기
  - 부부    # 집안일·데이트·돈 얘기
  - 일상    # 월요병·SNS·건강·이웃

